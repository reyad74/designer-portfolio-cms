# ══════════════════════════════════════════════════════════════════════
#  Portfolio CMS — production-parity stack
#  PostgreSQL + Django (gunicorn) + Next.js (standalone output)
#
#  Start:      docker compose up -d --build
#  Site:       http://localhost:3000
#  Admin:      http://localhost:3000/#/admin
#  API docs:   http://localhost:3000/api/docs
#
#  All credentials come from `.env` (see .env.example). Compose reads
#  `.env` automatically for ${...} substitution.
# ══════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@db:5432/${POSTGRES_DB:-portfolio}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1,host.docker.internal}
      UPLOAD_ROOT: /app/public/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    # Entrypoint (migrate → seed → gunicorn) lives in backend/Dockerfile CMD.
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/settings', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it must be a build arg
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      DJANGO_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-32-bytes-minimum-secret}
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
